name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "main-site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: main-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:gh-pages

      # Pre-rendered pages are served as-is; any other path falls back to the
      # client-side app shell (GitHub Pages serves 404.html for unknown paths).
      - name: Add SPA 404 fallback
        run: cp dist/spa.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
